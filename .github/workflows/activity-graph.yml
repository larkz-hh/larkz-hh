name: Update activity graph

on:
  schedule:
    - cron: "0 4 * * *"  # 每天 04:00 更新一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch activity graph SVG
        run: |
          URL="https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=github-compact"
          echo "== fetching: $URL"
          curl -sSL --retry 2 --connect-timeout 20 \
            -o profile/activity-graph.svg \
            -w "HTTP code: %{http_code}, size: %{size_download} bytes\n" \
            "$URL"
          echo "== first 300 bytes of response =="
          head -c 300 profile/activity-graph.svg 2>/dev/null || echo "(empty or missing file)"
          echo ""
          echo "== checking it is an SVG =="
          grep -q '<svg' profile/activity-graph.svg && echo "OK: valid SVG"

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push
